name: lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P setup/scripts moat setup/scripts/*.sh
      - name: compose config
        run: |
          cp .env.example .env
          sed -i 's/^HOST_IP=.*/HOST_IP=192.0.2.10/; s/^BIND_IP=.*/BIND_IP=192.0.2.10/' .env
          docker compose --env-file .env config -q
      - name: caddyfile syntax
        run: docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy adapt --config /etc/caddy/Caddyfile --validate=false > /dev/null
