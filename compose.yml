name: moat

x-setup: &setup
  build: ./setup
  image: moat-setup:local
  env_file: .env
  networks: [soc]
  restart: "no"

services:
  # 1. Local CA, service certs, rendered kibana.yml
  certs:
    <<: *setup
    command: /setup/certs.sh
    user: "0"
    volumes:
      - certs:/certs
      - kibana-config:/config

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      - node.name=es01
      - cluster.name=moat
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
      - xpack.license.self_generated.type=basic
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.chain.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: ${ES_MEM_LIMIT}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${BIND_IP}:${ES_PORT}:9200"
    networks: [soc]
    restart: unless-stopped
    healthcheck:
      # printf is a shell builtin, so the password never appears in a process's argv.
      test: ["CMD-SHELL", "printf 'user = \"elastic:%s\"\\n' \"$${ELASTIC_PASSWORD}\" | curl -sf -K - --cacert config/certs/ca/ca.crt https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 60

  # 2. Built-in passwords + Fleet Server service token
  setup:
    <<: *setup
    command: /setup/setup.sh
    user: "0"
    depends_on:
      es01: { condition: service_healthy }
    volumes:
      - certs:/certs:ro
      - tokens:/tokens

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - KIBANA_ENCRYPTION_KEY=${KIBANA_ENCRYPTION_KEY}
      - KIBANA_SECURITY_KEY=${KIBANA_SECURITY_KEY}
      - KIBANA_REPORTING_KEY=${KIBANA_REPORTING_KEY}
    mem_limit: ${KIBANA_MEM_LIMIT}
    volumes:
      - certs:/certs:ro
      - kibana-config:/usr/share/kibana/config/moat:ro
      - kibanadata:/usr/share/kibana/data
    command: ["/usr/local/bin/kibana-docker", "--config", "/usr/share/kibana/config/moat/kibana.yml"]
    networks: [soc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /certs/ca/ca.crt https://localhost:5601/api/status -o /dev/null -w '%{http_code}' | grep -qE '^(200|401)$'"]
      interval: 10s
      timeout: 10s
      retries: 90

  # 3. Fleet setup, Elastic Defend, analyst user, detection rules
  bootstrap:
    <<: *setup
    command: /setup/bootstrap.sh
    depends_on:
      kibana: { condition: service_healthy }
    volumes:
      - certs:/certs:ro
      - tokens:/tokens
      - ./rules:/rules:ro
      - ./dashboards:/dashboards:ro
      - ./sigma:/sigma:ro

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    user: "1000"
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://es01:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_SERVICE_TOKEN_PATH=/tokens/fleet-server.token
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/ca/ca.crt
    mem_limit: ${FLEET_MEM_LIMIT}
    volumes:
      - certs:/certs:ro
      - tokens:/tokens:ro
      - fleetdata:/usr/share/elastic-agent/state
    ports:
      - "${BIND_IP}:${FLEET_PORT}:8220"
    networks: [soc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /certs/ca/ca.crt https://localhost:8220/api/status | grep -q HEALTHY"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  caddy:
    image: caddy:${CADDY_VERSION}
    depends_on:
      kibana: { condition: service_healthy }
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Only the Kibana cert and the public CA cert; never the CA key.
      - { type: volume, source: certs, target: /certs/kibana, read_only: true, volume: { subpath: kibana } }
      - { type: volume, source: certs, target: /certs/public, read_only: true, volume: { subpath: public } }
      - caddydata:/data
    ports:
      - "${BIND_IP}:${KIBANA_PORT}:443"
      - "${BIND_IP}:${IRIS_PORT:-8443}:8443"
    networks: [soc, iris]
    restart: unless-stopped

  # ---- Network sensor (profile "sensor"; ./moat enables it when SENSOR_IFACE is set) ----
  # Zeek and Suricata need the host's network namespace to see the mirror NIC. Both put
  # it in promiscuous mode themselves; Suricata also turns off NIC offloading while up.
  zeek:
    image: zeek/zeek:${ZEEK_VERSION:-9.0.0}
    profiles: [sensor]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      - SENSOR_IFACE=${SENSOR_IFACE:-}
      - LOCAL_NETS=${LOCAL_NETS:-}
      - SENSOR_LOG_HOURS=${SENSOR_LOG_HOURS:-24}
    command: ["bash", "/sensor/run.sh"]
    mem_limit: ${ZEEK_MEM_LIMIT:-2g}
    volumes:
      - ./sensors/zeek:/sensor:ro
      - zeeklogs:/zeek
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:${SURICATA_VERSION:-8.0.7}
    profiles: [sensor]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      - SENSOR_IFACE=${SENSOR_IFACE:-}
      - LOCAL_NETS=${LOCAL_NETS:-}
      - SENSOR_LOG_HOURS=${SENSOR_LOG_HOURS:-24}
      # Run as uid/gid 1000 so the sensor agent (also 1000) can read eve files.
      - PUID=1000
      - PGID=1000
    entrypoint: ["bash", "/sensor/run.sh"]
    mem_limit: ${SURICATA_MEM_LIMIT:-3g}
    volumes:
      - ./sensors/suricata:/sensor:ro
      - suricatalogs:/var/log/suricata
      - suricatarules:/var/lib/suricata
    restart: unless-stopped

  # The collector agent (Fleet policy "moat collector", id moat-sensor): router syslog,
  # threat-intel feeds, and Zeek + Suricata logs when the sensor profile runs. Always on.
  # Uses the default output (per-policy outputs need Platinum). Enrolls once with the
  # token bootstrap wrote.
  sensor-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    depends_on:
      fleet-server: { condition: service_healthy }
    user: "1000"
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/ca/ca.crt
    entrypoint: ["/bin/sh", "-c", "export FLEET_ENROLLMENT_TOKEN=$$(cat /tokens/sensor.enroll); exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint"]
    hostname: moat-sensor
    mem_limit: ${SENSOR_AGENT_MEM_LIMIT:-1g}
    volumes:
      - certs:/certs:ro
      - tokens:/tokens:ro
      - sensordata:/usr/share/elastic-agent/state
      - zeeklogs:/sensor/zeek:ro
      - suricatalogs:/sensor/suricata:ro
    ports:
      # Syslog (CEF) from the UDM Pro / UniFi SIEM Server setting.
      - "${BIND_IP}:${SYSLOG_PORT:-5514}:5514/udp"
    networks: [soc]
    restart: unless-stopped

  # ---- Case management: DFIR-IRIS (profile "iris"; on by default in the standard profile) ----
  # IRIS gets only its own settings (never env_file: .env, which holds Elastic secrets).
  # Its DB and broker live on the iris network only; Caddy publishes the UI on IRIS_PORT.
  iris-db:
    image: ghcr.io/dfir-iris/iriswebapp_db:${IRIS_VERSION:-v2.4.29}
    profiles: [iris]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD:-}
      - POSTGRES_ADMIN_USER=raptor
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_ADMIN_PASSWORD:-}
      - POSTGRES_DB=iris_db
    mem_limit: 512m
    volumes:
      - irisdb:/var/lib/postgresql/data
    networks: [iris]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iris_db"]
      interval: 10s
      timeout: 5s
      retries: 30

  iris-rabbitmq:
    image: rabbitmq:${IRIS_RABBITMQ_VERSION:-3.13.7-alpine}
    profiles: [iris]
    mem_limit: 384m
    networks: [iris]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  iris-app:
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION:-v2.4.29}
    profiles: [iris]
    command: ["nohup", "./iris-entrypoint.sh", "iriswebapp"]
    depends_on:
      iris-db: { condition: service_healthy }
      iris-rabbitmq: { condition: service_healthy }
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD:-}
      - POSTGRES_ADMIN_USER=raptor
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_ADMIN_PASSWORD:-}
      - POSTGRES_DB=iris_db
      - POSTGRES_SERVER=iris-db
      - POSTGRES_PORT=5432
      - DOCKERIZED=1
      - IRIS_SECRET_KEY=${IRIS_SECRET_KEY:-}
      - IRIS_SECURITY_PASSWORD_SALT=${IRIS_SECURITY_PASSWORD_SALT:-}
      - CELERY_BROKER=amqp://iris-rabbitmq
      - CELERY_HOST=iris-rabbitmq
      - IRIS_AUTHENTICATION_TYPE=local
      - IRIS_ADM_USERNAME=administrator
      - IRIS_ADM_EMAIL=admin@moat.local
      - IRIS_ADM_PASSWORD=${IRIS_ADM_PASSWORD:-}
      - IRIS_ADM_API_KEY=${IRIS_ADM_API_KEY:-}
      - IRIS_ORGANISATION_NAME=moat
    mem_limit: 1g
    volumes:
      - irisdownloads:/home/iris/downloads
      - iristemplates:/home/iris/user_templates
      - irisserverdata:/home/iris/server_data
    networks: [iris]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/login"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  iris-worker:
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION:-v2.4.29}
    profiles: [iris]
    # Run Celery directly: IRIS's entrypoint backgrounds it (no signal handling) and
    # uses one pool process per CPU, which overran 768 MB on an 8-core box. Two is
    # plenty for module hooks (VirusTotal etc.) on a home SOC.
    command: ["./wait-for-iriswebapp.sh", "iris-app:8000", "celery", "-A", "app.celery", "worker",
              "-E", "-B", "-l", "INFO", "--concurrency", "${IRIS_WORKER_CONCURRENCY:-2}"]
    depends_on:
      iris-app: { condition: service_healthy }
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD:-}
      - POSTGRES_ADMIN_USER=raptor
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_ADMIN_PASSWORD:-}
      - POSTGRES_DB=iris_db
      - POSTGRES_SERVER=iris-db
      - POSTGRES_PORT=5432
      - DOCKERIZED=1
      - IRIS_SECRET_KEY=${IRIS_SECRET_KEY:-}
      - IRIS_SECURITY_PASSWORD_SALT=${IRIS_SECURITY_PASSWORD_SALT:-}
      - CELERY_BROKER=amqp://iris-rabbitmq
      - CELERY_HOST=iris-rabbitmq
      - IRIS_AUTHENTICATION_TYPE=local
      - IRIS_ADM_USERNAME=administrator
      - IRIS_ADM_EMAIL=admin@moat.local
      - IRIS_ADM_PASSWORD=${IRIS_ADM_PASSWORD:-}
      - IRIS_ADM_API_KEY=${IRIS_ADM_API_KEY:-}
      - IRIS_ORGANISATION_NAME=moat
    mem_limit: 768m
    volumes:
      - irisdownloads:/home/iris/downloads
      - iristemplates:/home/iris/user_templates
      - irisserverdata:/home/iris/server_data
    networks: [iris]
    restart: unless-stopped

  # Forwards open Security alerts into IRIS as alerts (with IOCs + device names), and
  # configures IRIS integrations (customer, VirusTotal) and adds Censys context to external IPs. Stdlib Python, non-root, read-only.
  bridge:
    build: ./bridge
    image: moat-bridge:local
    profiles: [iris]
    depends_on:
      iris-app: { condition: service_healthy }
    user: "1000"
    read_only: true
    tmpfs: [/tmp]
    environment:
      - ES_URL=https://es01:9200
      - BRIDGE_ES_PASSWORD=${BRIDGE_ES_PASSWORD:-}
      - IRIS_URL=http://iris-app:8000
      - IRIS_API_KEY=${IRIS_ADM_API_KEY:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-https://${HOST_IP}:${KIBANA_PORT}}
      - BRIDGE_MIN_SEVERITY=${BRIDGE_MIN_SEVERITY:-medium}
      - VT_API_KEY=${VT_API_KEY:-}
      - CENSYS_API_KEY=${CENSYS_API_KEY:-}
      - CENSYS_ORG_ID=${CENSYS_ORG_ID:-}
      - CENSYS_MONTHLY_LIMIT=${CENSYS_MONTHLY_LIMIT:-100}
    mem_limit: 128m
    volumes:
      - bridgestate:/state
      - { type: volume, source: certs, target: /certs/public, read_only: true, volume: { subpath: public } }
    networks: [soc, iris]
    restart: unless-stopped

networks:
  soc:
  iris:

volumes:
  certs:
  tokens:
  kibana-config:
  esdata:
  kibanadata:
  fleetdata:
  caddydata:
  zeeklogs:
  suricatalogs:
  suricatarules:
  sensordata:
  irisdb:
  irisdownloads:
  iristemplates:
  irisserverdata:
  bridgestate:
