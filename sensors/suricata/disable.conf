# Rules suricata-update disables on every update (one per line: SID, "re:<regex>", or
# "group:<file>"). Keep this to proven home-network noise; each entry is a blind spot.
# Apply changes with: docker compose restart suricata

# Decoder event for non-IP ethertypes; UniFi and other gear emit vendor frames constantly.
2200121
# QUIC parser errors, not attacks.
2231001
# STUN binding request/response: WebRTC (video calls, Discord, browsers). Benign at home.
2016149
2016150
# TCP stream-engine anomalies (invalid ack/timestamp, out of window...). On a mirror
# port these are capture artifacts (missed or reordered copies), not attacks. ~75% of
# all alerts on the first day.
group:stream-events.rules
# "ET DOS Possible SSDP Amplification Scan": fires on ordinary UPnP discovery from LAN
# devices to the router (udp/1900). Real amplification needs inbound WAN traffic, which
# the UDM blocks and reports via its own IPS.
2019102
